# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# Colors
$blue                   = 26adff
$cyan                   = 0de2c9
$pink                   = ec57fd
$background             = 2e2733
$background_light       = 35303a
$background_lightest    = aba3b3
$foreground             = f2f8f7
$foreground_darker      = e8d3ea
$foreground_darkest     = d5bbd8
$accent                 = 0de2c9

# See https://wiki.hyprland.org/Configuring/Monitors/
# name, size, position, scale
monitor = eDP-1	,1920x1080	,0x0,1.25
monitor = 	,preferred	,auto,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = waybar & gnome-keyring-daemon & swaync & ibus & hyprpaper & hypridle &
exec-once = /usr/bin/hyprland-per-window-layout &
# Set the wallpaper, to change the wallpaper first edit ./hyprpaper.conf
# exec-once = hyprctl hyprpaper wallpaper eDP-1,/usr/share/backgrounds/satellite.jpg
# exec-once = hyprctl hyprpaper wallpaper HDMI-A-1,/usr/share/backgrounds/satellite.jpg

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = kitty
$guiFileManager = thunar
$fileManager = kitty ranger
$menu = hyprlauncher
$config = kitty ranger ~/.config/hypr/

# Some default env vars.
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that
# Try to force to use wayland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,latam
    kb_model =
    kb_options = grp:win_space_toggle, compose:ralt #ralt
    kb_rules =
    numlock_by_default = true
    #kb_options=compose:ralt # Right alt as compose key
                            # expects ~/.XCompose

    # this allows to use dvorak to write while keeping keybindings in qwerty
    resolve_binds_by_sym = false

    follow_mouse = 2

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        middle_button_emulation = true
        drag_lock = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba($pinkff) rgba($blueff) 45deg
    col.inactive_border = rgba($pink77) rgba($blue77) 45deg

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    resize_on_border = true
    # extend_border_grab_area = 30
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 2
        
        xray = false
        brightness = 2
        vibrancy = 1
    }
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

group {
    # defaults are good
    groupbar {
        # I'm not sure where this config is applied
        font_family = "FiraCode Nerd Font Mono"
    }
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
}

# https://wiki.hypr.land/Configuring/Gestures/
gesture = 3, horizontal, workspace
gesture = 3, pinch, resize

misc {
# See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
    animate_manual_resizes = true
    # hide_cursor_on_key_press = true # should exist
}

binds {
# defaults are good
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more

device {
        name = wacom-one-by-wacom-s-pen
        output = DP-1
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule = float true, match:class thunar, match:title ^Rename.*,
windowrule = float true, match:class org.speedcrunch.speedcrunch
windowrule = float true, match:title Save
windowrule = float true, match:class xdg-desktop-portal-gtk

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
     bind = $mainMod, Return, exec, $terminal
     bind = $mainMod, Q, killactive,
     bind = $mainMod SHIFT, Q, exit,
     bind = $mainMod, E, exec, $guiFileManager
     bind = $mainMod, M, togglefloating,
     bind = $mainMod SHIFT, M, fullscreen,
     bind = $mainMod, SPACE, exec, $menu
     bind = $mainMod, P, pseudo, # dwindle
     bind = $mainMod, O, togglesplit, # dwindle
     bind = $mainMod, V, exec, swaync-client -t -sw
     bind = $mainMod SHIFT, E, exec, $fileManager
     bind = $mainMod, I, exec, $config

# Move focus with mainMod + arrow keys or hjkl
     bind = $mainMod, left, movefocus, l
     bind = $mainMod, right, movefocus, r
     bind = $mainMod, up, movefocus, u
     bind = $mainMod, down, movefocus, d

     bind = $mainMod, H, movefocus, l
     bind = $mainMod, L, movefocus, r
     bind = $mainMod, K, movefocus, u
     bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
     bind = $mainMod, 1, workspace, 1
     bind = $mainMod, 2, workspace, 2
     bind = $mainMod, 3, workspace, 3
     bind = $mainMod, 4, workspace, 4
     bind = $mainMod, 5, workspace, 5
     bind = $mainMod, 6, workspace, 6
     bind = $mainMod, 7, workspace, 7
     bind = $mainMod, 8, workspace, 8
     bind = $mainMod, 9, workspace, 9
     bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
     bind = $mainMod SHIFT, 1, movetoworkspace, 1
     bind = $mainMod SHIFT, 2, movetoworkspace, 2
     bind = $mainMod SHIFT, 3, movetoworkspace, 3
     bind = $mainMod SHIFT, 4, movetoworkspace, 4
     bind = $mainMod SHIFT, 5, movetoworkspace, 5
     bind = $mainMod SHIFT, 6, movetoworkspace, 6
     bind = $mainMod SHIFT, 7, movetoworkspace, 7
     bind = $mainMod SHIFT, 8, movetoworkspace, 8
     bind = $mainMod SHIFT, 9, movetoworkspace, 9
     bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move workspaces with mainMod + Page Controls
bind = $mainMod, code:110, workspace, 0
bind = $mainMod, code:115, workspace, 5
bind = $mainMod, code:112, workspace, e-1
bind = $mainMod, code:117, workspace, e+1

bind = $mainMod SHIFT, code:110, movetoworkspace, 0
bind = $mainMod SHIFT, code:115, movetoworkspace, 5
bind = $mainMod SHIFT, code:112, movetoworkspace, e-1
bind = $mainMod SHIFT, code:117, movetoworkspace, e+1

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Scroll through existing workspaces with horizontal scroll (doesn't work)
#bind = , mouse:276, workspace, e+1
#bind = , mouse:275, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media
bindel=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.2
bindel=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- -l 1.2
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindl=, XF86AudioNext, exec, playerctl next
bindl=, XF86AudioPrev, exec, playerctl previous
bindl=, XF86AudioPlay, exec, playerctl play-pause

# screenshots
# all outputs
bind = ,Print, exec, hyprshot -m output
bind = SHIFT, Print, exec, hyprshot -m output --clipboard-only

# area
bind = $mainMod, Print, exec, hyprshot -m region
bind = $mainMod SHIFT, Print, exec, hyprshot -m region --clipboard-only

# window
bind = ALT, Print, exec, hyprshot -m window
bind = ALT SHIFT, Print, exec, hyprshot -m window --clipboard-only

# lock screen
bind = $mainMod, Escape, exec, hyprlock

# Brightness
bindel=, XF86MonBrightnessUp, exec, brightnessctl s +1%
bindel=, XF86MonBrightnessDown, exec, brightnessctl s 1%-
